spring:
  application:
    name: kmtech.api

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/kmtech_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:amir2026}

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_MODE:update}
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_LOGIN}
    password: ${BREVO_SMTP_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET_KEY:kmtech-super-secret-key-pour-le-dev-local-uniquement-123456}
  expiration: 86400000

app:
  upload:
    directory: ./uploads
    max-file-size: 10MB
    allowed-file-types:
      - image/jpeg
      - image/png
      - image/webp
  mail:
    from: ${MAIL_FROM}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  admin-notification-email: ${ADMIN_NOTIFICATION_EMAIL:admin@kmtech.km}