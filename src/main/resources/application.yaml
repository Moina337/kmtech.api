spring:
  application:
    name: kmtech.api

  # Configuration standard pour bloquer les gros fichiers au niveau HTTP
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/kmtech_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:amir2026}

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_MODE:update} # 'update' en local, pourra être surchargé en 'validate' en prod
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET_KEY:kmtech-super-secret-key-pour-le-dev-local-uniquement-123456}
  expiration: 86400000
  
app:
  upload:
    directory: ./uploads
    max-file-size: 10MB
    allowed-file-types:
      - image/jpeg
      - image/png
      - image/webp	    
  
