services:
  db:
    image: postgres:16-alpine
    container_name: kmtech-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kmtech_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - kmtech_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    container_name: kmtech-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      HIBERNATE_DDL_MODE: ${HIBERNATE_DDL_MODE:-update}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY}
      MAIL_FROM: ${MAIL_FROM}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8080:8080"
    volumes:
      - kmtech_uploads:/app/uploads

volumes:
  kmtech_db_data:
  kmtech_uploads:
